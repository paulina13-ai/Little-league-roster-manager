          </div>
          <div class="sb-name">${cur.number != null && cur.number !== '' ? `<span style="color:var(--gold-bright);">#${escape(String(cur.number))}</span> ` : ''}${escape(cur.name)}</div>
          <div class="sb-meta">BATTER ${g.currentIndex + 1} OF ${len}</div>
        </div>

        <div class="game-controls" style="margin-bottom:14px;">
          <button class="btn btn-ghost" data-action="prev-batter">◀ PREVIOUS BATTER</button>
          <button class="btn btn-next-batter" data-action="next-batter">NEXT BATTER ▶</button>
        </div>

        <div class="next-card deck" style="margin-bottom:14px;">
          <div class="next-label">ON DECK</div>
          <div class="next-name">${onDeck.number != null && onDeck.number !== '' ? `<span style="color:var(--gold-deep);">#${escape(String(onDeck.number))}</span> ` : ''}${escape(onDeck.name)}</div>
        </div>
        <div class="card">
          <div class="card-title">Full Batting Order</div>
          <ul class="lineup-list">
            ${g.lineup.map((p, i) => {
              const cls = i === g.currentIndex ? 'current' : (i === (g.currentIndex + 1) % len ? 'upcoming' : '');
              const tag = i === g.currentIndex ? 'AT BAT' : (i === (g.currentIndex + 1) % len ? 'ON DECK' : '');
              return `
                <li class="lineup-item ${cls}">
                  <div class="lineup-num">${i + 1}</div>
                  <span class="player-jersey" style="margin-right:0;">${p.number != null && p.number !== '' ? '#' + escape(String(p.number)) : '—'}</span>
                  <div class="lineup-name">${escape(p.name)}</div>
                  ${tag ? `<div class="lineup-tag">${tag}</div>` : ''}
                </li>
              `;
            }).join('')}
          </ul>
          ${renderLateArrival(g)}
          ${endGameBlock}
        </div>
      ` : `
        <!-- FIELDING MODE -->
        <div class="card">
          <div class="card-title">
            Field Positions
            <button class="btn-small btn btn-ghost" data-action="reshuffle-fielding" style="font-size:11px;padding:6px 12px;letter-spacing:1px;">🎲 RESHUFFLE</button>
          </div>
          ${renderFieldingForCurrentInning(g)}
          ${renderLateArrival(g)}
          ${endGameBlock}
        </div>
      `}
    </div>
    ${renderCatcherPickModal()}
  `;
}

// ============ RENDER ============
function updateHeaderBranding() {
  const team = getActiveTeam();
  const theme = team ? (MLB_THEMES[team.mlbTeam] || MLB_THEMES.mlb) : MLB_THEMES.mlb;
  const mark = document.getElementById('brand-mark');
  const city = document.getElementById('brand-city');
  const mascot = document.getElementById('brand-mascot');
  if (mark) mark.textContent = theme.abbr;
  if (city) city.textContent = theme.city.toUpperCase();
  // Show team's custom name (often the mascot) plus "LINEUP"
  if (mascot) mascot.textContent = `${(team ? team.name : theme.mascot).toUpperCase()} · LINEUP`;
}

// Render the dropdown menu HTML.
// Layout: each team listed at top. The active team is highlighted and has
// "Team HQ" and "Manage Teams" actions nested directly underneath. Other teams
// are tappable to switch.
function renderBrandMenu() {
  const activeId = state.activeTeamId;
  return `
    ${state.teams.map(team => {
      const theme = MLB_THEMES[team.mlbTeam] || MLB_THEMES.mlb;
      const isActive = team.id === activeId;
      if (isActive) {
        return `
          <div class="menu-section">
            <div class="menu-item active" style="cursor:default;">
              <span class="menu-item-mark" style="background:${theme.accent};color:${theme.dark};border:2px solid ${theme.primary};">${theme.abbr}</span>
              <span class="menu-item-label">${escape(team.name)}</span>
              <span class="menu-item-active-pill">ACTIVE</span>
            </div>
            <button class="menu-item menu-subitem" data-menu-action="go-home">
              <span class="menu-item-icon">🏠</span>
              <span class="menu-item-label">Team HQ</span>
            </button>
            <button class="menu-item menu-subitem" data-menu-action="go-manage">
              <span class="menu-item-icon">⚙️</span>
              <span class="menu-item-label">Manage Teams</span>
            </button>
          </div>
        `;
      } else {
        return `
          <div class="menu-section">
            <button class="menu-item" data-menu-action="switch" data-id="${team.id}">
              <span class="menu-item-mark" style="background:${theme.accent};color:${theme.dark};border:2px solid ${theme.primary};">${theme.abbr}</span>
              <span class="menu-item-label">${escape(team.name)}</span>
              <span class="menu-item-active-pill" style="background:transparent;color:var(--gray);border:1px solid var(--cream-dark);">SWITCH</span>
            </button>
          </div>
        `;
      }
    }).join('')}
  `;
}

function render() {
  const root = document.getElementById('app');
  const back = document.getElementById('back-btn');
  const brandBtn = document.getElementById('brand-btn');
  const menu = document.getElementById('brand-menu');

  // Apply theme on every render (cheap; ensures correctness after switches)
  const team = getActiveTeam();
  if (team) applyTheme(team.mlbTeam);
  updateHeaderBranding();

  let html = '';
  if (state.view === 'team-setup') html = viewTeamSetup();
  else if (state.view === 'team-manage') html = viewTeamManage();
  else if (state.view === 'home') html = viewHome();
  else if (state.view === 'attendance') html = viewAttendance();
  else if (state.view === 'lineup') html = viewLineup();
  else if (state.view === 'game') html = viewGame();

  root.innerHTML = html;

  // Back button visibility - hide on home and the "first" team setup
  const onFirstSetup = state.view === 'team-setup' && state.ui.teamSetupMode === 'first';
  back.style.display = (state.view === 'home' || onFirstSetup) ? 'none' : 'inline-block';

  // Header dropdown menu
  if (menu && brandBtn) {
    if (state.ui.menuOpen && !onFirstSetup) {
      menu.innerHTML = renderBrandMenu();
      menu.style.display = 'block';
      brandBtn.classList.add('open');
    } else {
      menu.style.display = 'none';
      menu.innerHTML = '';
      brandBtn.classList.remove('open');
    }
  }

  bindEvents();
}

function bindEvents() {
  // Brand button → toggle dropdown menu
  const brandBtn = document.getElementById('brand-btn');
  if (brandBtn) {
    brandBtn.onclick = (e) => {
      e.stopPropagation();
      // First-time team setup: brand button still does nothing useful
      if (state.teams.length === 0) {
        state.view = 'team-setup';
        state.ui.teamSetupMode = 'first';
        state.ui.menuOpen = false;
        render();
        return;
      }
      state.ui.menuOpen = !state.ui.menuOpen;
      render();
    };
  }

  // Menu item clicks
  document.querySelectorAll('[data-menu-action]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const act = el.getAttribute('data-menu-action');
      state.ui.menuOpen = false;
      if (act === 'go-home') {
        // Reset transient UI state when going home
        state.ui.pendingScheduleStart = null;
        state.ui.editingTeamId = null;
        state.ui.confirmEndGame = false;
        state.ui.showLateArrival = false;
        state.view = 'home';
        render();
      } else if (act === 'go-manage') {
        state.view = 'team-manage';
        render();
      } else if (act === 'switch') {
        const id = el.getAttribute('data-id');
        pickTeam(id);
      }
    });
  });

  // Close menu when clicking anywhere else
  if (state.ui.menuOpen) {
    const closeOnOutside = (e) => {
      const menu = document.getElementById('brand-menu');
      const btn = document.getElementById('brand-btn');
      if (menu && !menu.contains(e.target) && btn && !btn.contains(e.target)) {
        state.ui.menuOpen = false;
        document.removeEventListener('click', closeOnOutside);
        render();
      }
    };
    // Defer attachment so the click that opened the menu doesn't immediately close it
    setTimeout(() => document.addEventListener('click', closeOnOutside), 0);
  }

  // Back
  document.getElementById('back-btn').onclick = () => {
    if (state.view === 'attendance') {
      state.ui.pendingScheduleStart = null;
      state.view = 'home';
    }
    else if (state.view === 'lineup') state.view = 'attendance';
    else if (state.view === 'game') state.view = 'lineup';
    else if (state.view === 'team-manage') state.view = 'home';
    else if (state.view === 'team-setup') {
      // Only allow back from add-team setup, not first-time
      if (state.ui.teamSetupMode === 'add') {
        state.view = 'team-manage';
        state.ui.teamSetupMode = null;
      }
    }
    render();
  };

  // Team setup name input
  const setupName = document.getElementById('setup-team-name');
  if (setupName) {
    setupName.addEventListener('input', (e) => {
      state.ui.teamSetupName = e.target.value;
    });
  }

  // Add player input - Enter key
  const input = document.getElementById('new-player-input');
  if (input) {
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        addPlayer(input.value);
        input.value = '';
      }
    });
  }

  // Team-roster edit inputs - Enter key on either input adds the player
  document.querySelectorAll('[id^="edit-roster-input-"], [id^="edit-roster-num-"]').forEach(inp => {
    inp.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const teamId = inp.id.replace(/^edit-roster-(input|num)-/, '');
        const nameInp = document.getElementById('edit-roster-input-' + teamId);
        const numInp = document.getElementById('edit-roster-num-' + teamId);
        if (nameInp && numInp) {
          addPlayerToTeam(teamId, nameInp.value, numInp.value);
          nameInp.value = '';
          numInp.value = '';
        }
      }
    });
  });

  // Action delegation
  document.querySelectorAll('[data-action]').forEach(el => {
    const action = el.getAttribute('data-action');
    el.addEventListener('click', (e) => handleAction(action, el, e));
  });
}

function handleAction(action, el, e) {
  // If we have a pending confirm and the user clicks a DIFFERENT action, clear it
  // (so first-tap "DELETE?" buttons revert to normal when user changes their mind)
  const confirmActions = new Set(['delete-team', 'remove-game', 'start-scheduled']);
  if (state.ui.pendingConfirm && !confirmActions.has(action)) {
    state.ui.pendingConfirm = null;
    // Don't return — continue processing the new action; render at the end via the normal flow
  }
  if (action === 'add-player') {
    const inp = document.getElementById('new-player-input');
    if (inp) { addPlayer(inp.value); inp.value = ''; }
  } else if (action === 'remove-player') {
    removePlayer(el.getAttribute('data-id'));
  } else if (action === 'add-team-player') {
    const teamId = el.getAttribute('data-id');
    const nameInp = document.getElementById('edit-roster-input-' + teamId);
    const numInp = document.getElementById('edit-roster-num-' + teamId);
    if (nameInp && numInp) {
      addPlayerToTeam(teamId, nameInp.value, numInp.value);
      nameInp.value = '';
      numInp.value = '';
    }
  } else if (action === 'remove-team-player') {
    const teamId = el.getAttribute('data-team-id');
    const playerId = el.getAttribute('data-id');
    removePlayerFromTeam(teamId, playerId);
  } else if (action === 'toggle-attend') {
    toggleAttend(el.getAttribute('data-id'));
  } else if (action === 'all-on') {
    setAllAttending(true);
  } else if (action === 'all-off') {
    setAllAttending(false);
  } else if (action === 'set-everyone-fields-on') {
    state.ui.everyoneFields = true;
    render();
  } else if (action === 'set-everyone-fields-off') {
    state.ui.everyoneFields = false;
    render();
  } else if (action === 'generate-lineup') {
    generateLineup();
  } else if (action === 'reshuffle') {
    reshuffle();
  } else if (action === 'sort-random') {
    setBattingOrder('random');
  } else if (action === 'sort-asc') {
    setBattingOrder('asc');
  } else if (action === 'sort-desc') {
    setBattingOrder('desc');
  } else if (action === 'start-game') {
    startGame();
  } else if (action === 'next-batter') {
    nextBatter();
  } else if (action === 'prev-batter') {
    prevBatter();
  } else if (action === 'next-half') {
    nextHalf();
  } else if (action === 'set-home') {
    setHomeAway(true);
  } else if (action === 'set-away') {
    setHomeAway(false);
  } else if (action === 'reshuffle-fielding') {
    reshuffleCurrentInningFielding();
  } else if (action === 'toggle-can-catch') {
    toggleCanCatch(el.getAttribute('data-team-id'), el.getAttribute('data-id'));
  } else if (action === 'catcher-1b-on') {
    setCatcherOn1B(true);
  } else if (action === 'catcher-1b-off') {
    setCatcherOn1B(false);
  } else if (action === 'pick-1b') {
    assignCatcherTo1B(el.getAttribute('data-id'));
  } else if (action === 'close-catcher-pick') {
    state.ui.catcherPickFor1B = false;
    render();
  } else if (action === 'end-game') {
    endGame();
  } else if (action === 'cancel-end-game') {
    cancelEndGame();
  } else if (action === 'show-late-arrival') {
    state.ui.showLateArrival = true;
    render();
  } else if (action === 'hide-late-arrival') {
    state.ui.showLateArrival = false;
    render();
  } else if (action === 'add-late') {
    addLateArrival(el.getAttribute('data-id'));
  } else if (action === 'resume') {
    state.view = 'game';
    render();
  } else if (action === 'add-game') {
    state.ui.editingGameId = 'new';
    render();
  } else if (action === 'edit-game') {
    state.ui.editingGameId = el.getAttribute('data-id');
    render();
  } else if (action === 'cancel-game-form') {
    state.ui.editingGameId = null;
    render();
  } else if (action === 'save-game') {
    const date = (document.getElementById('form-date') || {}).value || '';
    const time = (document.getElementById('form-time') || {}).value || '';
    const opponent = (document.getElementById('form-opponent') || {}).value || '';
    const location = (document.getElementById('form-location') || {}).value || '';
    if (!date || !opponent.trim()) {
      alert('Please enter at least a date and opponent.');
      return;
    }
    saveGameEntry({ id: el.getAttribute('data-id'), date, time, opponent, location });
  } else if (action === 'remove-game') {
    const id = el.getAttribute('data-id');
    const pc = state.ui.pendingConfirm;
    if (pc && pc.type === 'remove-game' && pc.id === id) {
      removeScheduledGame(id);
    } else {
      state.ui.pendingConfirm = { type: 'remove-game', id };
      render();
    }
  } else if (action === 'start-scheduled') {
    const id = el.getAttribute('data-id');
    if (state.game) {
      const pc = state.ui.pendingConfirm;
      if (pc && pc.type === 'discard-active-game' && pc.id === id) {
        state.game = null;
        saveGame();
        state.ui.pendingConfirm = null;
        startScheduledGame(id);
      } else {
        state.ui.pendingConfirm = { type: 'discard-active-game', id };
        render();
      }
      return;
    }
    startScheduledGame(id);
  } else if (action === 'pick-mlb') {
    const key = el.getAttribute('data-key');
    if (state.view === 'team-setup') {
      state.ui.teamSetupChoice = key;
      // If user hasn't typed a custom name, suggest the mascot
      const nameInput = document.getElementById('setup-team-name');
      const currentName = nameInput ? nameInput.value : state.ui.teamSetupName;
      // Update suggested name only if it matches a previous mascot suggestion
      const wasSuggested = Object.values(MLB_THEMES).some(t => t.mascot === currentName);
      if (!currentName || wasSuggested) {
        state.ui.teamSetupName = MLB_THEMES[key].mascot;
      }
      render();
    } else if (state.view === 'team-manage' && state.ui.editingTeamId) {
      // Apply theme to the team being edited
      const teamId = state.ui.editingTeamId;
      const nameInput = document.getElementById('edit-team-name-' + teamId);
      const newName = nameInput ? nameInput.value : undefined;
      updateTeamTheme(teamId, key, newName);
    }
  } else if (action === 'confirm-team-setup') {
    const nameInput = document.getElementById('setup-team-name');
    const name = nameInput ? nameInput.value : state.ui.teamSetupName;
    const choice = state.ui.teamSetupChoice || 'mlb';
    if (choice === 'mlb') {
      alert('Please pick an MLB team theme above.');
      return;
    }
    if (!name || !name.trim()) {
      alert('Please give your team a name.');
      return;
    }
    createTeam(name, choice);
  } else if (action === 'cancel-team-setup') {
    state.ui.teamSetupMode = null;
    state.ui.teamSetupName = '';
    state.view = state.teams.length > 0 ? 'team-manage' : 'home';
    render();
  } else if (action === 'add-new-team') {
    state.ui.teamSetupMode = 'add';
    state.ui.teamSetupChoice = 'mlb';
    state.ui.teamSetupName = '';
    state.view = 'team-setup';
    render();
  } else if (action === 'switch-team') {
    pickTeam(el.getAttribute('data-id'));
  } else if (action === 'edit-team') {
    state.ui.editingTeamId = el.getAttribute('data-id');
    render();
  } else if (action === 'cancel-team-edit') {
    state.ui.editingTeamId = null;
    render();
  } else if (action === 'save-team-edit') {
    const teamId = el.getAttribute('data-id');
    const nameInput = document.getElementById('edit-team-name-' + teamId);
    if (nameInput) updateTeamTheme(teamId, undefined, nameInput.value);
  } else if (action === 'delete-team') {
    const id = el.getAttribute('data-id');
    const pc = state.ui.pendingConfirm;
    if (pc && pc.type === 'delete-team' && pc.id === id) {
      deleteTeam(id);
    } else {
      state.ui.pendingConfirm = { type: 'delete-team', id };
      render();
    }
  }
}

// ============ INIT ============
(async function init() {
  await loadFromStorage();
  // Apply theme based on active team (or generic MLB if none)
  const team = getActiveTeam();
  applyTheme(team ? team.mlbTeam : 'mlb');
  // ensure attending defaults
  state.roster.forEach(p => { if (p.attending === undefined) p.attending = true; });
  // No teams yet → first run team setup
  if (state.teams.length === 0) {
    state.view = 'team-setup';
    state.ui.teamSetupMode = 'first';
    state.ui.teamSetupChoice = 'mlb';
    state.ui.teamSetupName = '';
  }
  render();
})();
</script>
</body>
</html>
